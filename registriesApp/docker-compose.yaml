services:
  db:
    image: postgres:15-alpine # or image of prosgress of your preference.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=zakup_registry
    ports:
      - "5432:5432"

volumes:
  postgres_data: